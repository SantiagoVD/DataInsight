<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Arquitectura serverless de DataInsight</title>
  <desc id="desc">Frontend React conectado a API Gateway, funciones Lambda, S3, SQS y CloudWatch.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#f97316"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity=".14"/>
    </filter>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #172033; }
      .label { font: 700 18px Arial, sans-serif; fill: #172033; }
      .text { font: 15px Arial, sans-serif; fill: #465268; }
      .small { font: 13px Arial, sans-serif; fill: #465268; }
      .box { fill: #fff; stroke-width: 2; rx: 14; filter: url(#shadow); }
      .flow { stroke: #f97316; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .dashed { stroke: #64748b; stroke-width: 2; stroke-dasharray: 7 6; fill: none; }
    </style>
  </defs>

  <rect width="1400" height="820" fill="#f8fafc"/>
  <text x="54" y="58" class="title">DataInsight · Arquitectura serverless</text>
  <text x="54" y="88" class="text">Carga, procesamiento asíncrono y análisis de archivos CSV en AWS</text>

  <rect x="36" y="125" width="220" height="270" class="box" stroke="#8b5cf6"/>
  <text x="58" y="160" class="label">1. Frontend web</text>
  <text x="58" y="190" class="text">React + TypeScript + Vite</text>
  <circle cx="90" cy="245" r="33" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <path d="M73 248h34M90 229v32M77 237c8 7 18 7 26 0M77 257c8-7 18-7 26 0" stroke="#7c3aed" stroke-width="2" fill="none"/>
  <text x="58" y="315" class="small">• Carga de CSV</text>
  <text x="58" y="340" class="small">• Seguimiento del JobId</text>
  <text x="58" y="365" class="small">• Dashboard de métricas</text>

  <rect x="300" y="125" width="220" height="270" class="box" stroke="#6366f1"/>
  <text x="322" y="160" class="label">2. API</text>
  <text x="322" y="190" class="text">Amazon API Gateway</text>
  <rect x="345" y="220" width="130" height="80" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="373" y="254" class="label" font-size="16">HTTP API</text>
  <text x="359" y="278" class="small">/uploads · /jobs</text>
  <text x="359" y="295" class="small">GET /jobs/{id}</text>
  <text x="322" y="345" class="small">CORS y respuestas JSON</text>

  <rect x="565" y="125" width="280" height="270" class="box" stroke="#f97316"/>
  <text x="587" y="160" class="label">3. Compute</text>
  <text x="587" y="190" class="text">AWS Lambda · C# / .NET 8</text>
  <rect x="600" y="220" width="210" height="52" rx="9" fill="#fff7ed" stroke="#fb923c"/>
  <text x="618" y="252" class="label" font-size="16">CreateUpload / CreateJob</text>
  <rect x="600" y="292" width="210" height="52" rx="9" fill="#fff7ed" stroke="#fb923c"/>
  <text x="625" y="324" class="label" font-size="16">GetJobResult</text>
  <text x="587" y="370" class="small">Genera URLs, Jobs y respuestas</text>

  <rect x="890" y="125" width="220" height="270" class="box" stroke="#16a34a"/>
  <text x="912" y="160" class="label">4. Storage</text>
  <text x="912" y="190" class="text">Amazon S3 · Bucket privado</text>
  <path d="M958 225h80l-8 20h-64zM963 245v55c0 10 10 16 35 16s35-6 35-16v-55" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="918" y="345" class="small">uploads/ · resultados JSON</text>
  <text x="918" y="368" class="small">URLs prefirmadas para PUT</text>

  <rect x="1155" y="125" width="210" height="270" class="box" stroke="#db2777"/>
  <text x="1177" y="160" class="label">5. Messaging</text>
  <text x="1177" y="190" class="text">Amazon SQS</text>
  <rect x="1198" y="225" width="125" height="70" rx="12" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <path d="M1220 260c16-25 30 25 46 0s30 25 46 0" stroke="#db2777" stroke-width="3" fill="none"/>
  <text x="1177" y="345" class="small">Cola de procesamiento</text>
  <text x="1177" y="368" class="small">Batch size: 1</text>

  <path d="M256 260h44" class="flow"/>
  <path d="M520 230h45" class="flow"/>
  <path d="M520 315h45" class="flow"/>
  <path d="M845 250h45" class="flow"/>
  <path d="M845 330h45" class="flow"/>
  <path d="M1110 260h45" class="flow"/>

  <rect x="565" y="475" width="280" height="190" class="box" stroke="#f97316"/>
  <text x="587" y="510" class="label">6. Worker</text>
  <text x="587" y="540" class="text">ProcessFileFunction</text>
  <text x="587" y="575" class="small">Lee el CSV desde S3</text>
  <text x="587" y="600" class="small">Agrupa productos y calcula:</text>
  <text x="587" y="625" class="small">registros · unidades · ingresos</text>
  <text x="587" y="650" class="small">Guarda results/{jobId}.json</text>

  <path d="M1260 395v80H845" class="flow"/>
  <path d="M705 395v80" class="flow"/>
  <path d="M845 570h45" class="flow"/>
  <path d="M890 605H430V395" class="flow"/>
  <text x="855" y="462" class="small">mensaje SQS</text>
  <text x="745" y="455" class="small">consume</text>
  <text x="465" y="590" class="small">resultado</text>

  <rect x="920" y="475" width="250" height="190" class="box" stroke="#0ea5e9"/>
  <text x="942" y="510" class="label">7. Observabilidad</text>
  <text x="942" y="548" class="text">Amazon CloudWatch</text>
  <text x="942" y="585" class="small">Logs de API y worker</text>
  <text x="942" y="612" class="small">Errores, duración e invocaciones</text>
  <text x="942" y="639" class="small">Métricas operativas</text>
  <path d="M845 190h55v285" class="dashed"/>
  <path d="M845 540h75" class="dashed"/>

  <rect x="1205" y="475" width="160" height="190" class="box" stroke="#0f766e"/>
  <text x="1227" y="510" class="label">8. IaC</text>
  <text x="1227" y="550" class="text">AWS SAM</text>
  <text x="1227" y="580" class="small">CloudFormation</text>
  <text x="1227" y="620" class="small">API · S3 · SQS</text>
  <text x="1227" y="642" class="small">Lambda · permisos</text>

  <rect x="36" y="730" width="1329" height="55" rx="12" fill="#fff7ed" stroke="#fed7aa"/>
  <circle cx="62" cy="757" r="8" fill="#f97316"/>
  <text x="82" y="763" class="text">Flujo de datos y eventos</text>
  <line x1="310" y1="757" x2="390" y2="757" class="flow"/>
  <circle cx="480" cy="757" r="8" fill="#64748b"/>
  <text x="500" y="763" class="text">Logs y monitoreo</text>
  <line x1="700" y1="757" x2="780" y2="757" class="dashed"/>
  <text x="805" y="763" class="text">Infraestructura como código</text>
</svg>
